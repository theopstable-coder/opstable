name: Collect Ops Radar news

on:
  schedule:
    - cron: "17 0 * * *"   # every day 05:47 IST (00:17 UTC)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        run: python scripts/collect_news.py
      - name: Save if changed
        run: |
          git config user.name "ops-radar-bot"
          git config user.email "ops-radar-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Ops Radar update $(date -u +%Y-%m-%d)"
          git push
